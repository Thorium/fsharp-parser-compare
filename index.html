<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F# grammar A/B — ionide vs MangelMaxime</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>F# tree-sitter grammars, side by side</h1>
  <p class="sub">
    <span class="tag tag-i">ionide/tree-sitter-fsharp</span> <code id="ver-ionide">…</code>
    <span class="tag tag-m">MangelMaxime/tree-sitter-fsharp</span> <code id="ver-maxim">…</code>
    — both compiled to WASM with tree-sitter CLI 0.26.11. Hover a token for its node chain,
    highlight capture and <code>tags.scm</code> definition.
  </p>
</header>

<section id="input">
  <div class="bar">
    <label class="file-btn">Open .fs / .fsx<input type="file" id="file" accept=".fs,.fsx,.fsi,.txt"></label>
    <span id="fname" class="fname">…</span>
    <span class="spacer"></span>
    <label class="chk"><input type="checkbox" id="sync" checked> sync scroll</label>
    <button id="theme" class="ghost" title="Light / dark / follow system">◐ system</button>
    <span id="status" class="status">loading grammars…</span>
  </div>
  <textarea id="src" spellcheck="false" autocomplete="off"></textarea>
</section>

<section id="panes">
  <div class="pane" data-id="ionide">
    <div class="pane-head">
      <span class="tag tag-i">ionide</span>
      <span class="stats" id="stats-ionide"></span>
      <span class="spacer"></span>
      <div class="tabs" data-for="ionide">
        <button class="on" data-view="hl">Highlight</button><button data-view="tree">Tree</button><button data-view="err">Errors</button>
      </div>
    </div>
    <div class="pane-body" data-id="ionide"><pre id="out-ionide" class="out"></pre></div>
  </div>
  <div class="pane" data-id="maxim">
    <div class="pane-head">
      <span class="tag tag-m">maxim</span>
      <span class="stats" id="stats-maxim"></span>
      <span class="spacer"></span>
      <div class="tabs" data-for="maxim">
        <button class="on" data-view="hl">Highlight</button><button data-view="tree">Tree</button><button data-view="err">Errors</button>
      </div>
    </div>
    <div class="pane-body" data-id="maxim"><pre id="out-maxim" class="out"></pre></div>
  </div>
</section>

<div id="tip" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
