name: Refresh grammar releases

# Registers new ionide and MangelMaxime releases as variants, moves the -main
# variants to the default branch's queries (scripts/refresh.mjs),
# and commits them to main, which GitHub Pages serves.

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # web-tree-sitter is used to check each new parser loads in the page's runtime;
      # --ignore-scripts skips the tree-sitter CLI binary download, which is not needed.
      - run: npm ci --ignore-scripts

      - id: refresh
        run: node scripts/refresh.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        if: steps.refresh.outputs.changed != ''
        env:
          CHANGED: ${{ steps.refresh.outputs.changed }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A grammars
          git commit -m "Update grammars: $CHANGED"
          git push
          # A branch-deployed Pages site may not rebuild for a GITHUB_TOKEN push.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
